name: Update publications database

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

  # Allow manual execution from Actions tab
  workflow_dispatch:


permissions:
  contents: write


jobs:
  update-publications:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install requests


      - name: Run publication fetcher
        run: |
          python papers_fetcher/fetcher.py


      - name: Commit updated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _data/publications.json

          git diff --cached --quiet || git commit -m "Update publications database"

          git push