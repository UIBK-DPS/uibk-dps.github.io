name: Deploy Jekyll site to Pages

on:
  # Deploy on normal pushes to main
  push:
    branches: ["main"]

  # Deploy after the publications database workflow finishes
  workflow_run:
    workflows:
      - "Update publications database"
    types:
      - completed

  # Allow manual execution from Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # Build job
  build:
    # Run for pushes/manual runs, or successful publication updates
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Trigger webhook
        uses: joelwmale/webhook-action@master
        with:
          url: ${{ secrets.MY_WEBHOOK_URL }}
          headers: '{"Content-Type": "application/json", "X-Webhook-Token": "${{ secrets.WEBHOOK_TOKEN }}"}'
          body: '{"ref": "${{ github.ref }}", "repository": {"name": "${{ github.repository }}", "clone_url": "${{ github.server_url }}/${{ github.repository_owner }}"} }'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4